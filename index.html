<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Varsity QB Scorer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#171717;padding-bottom:90px}header{background:#111;color:#fff;padding:14px;position:sticky;top:0;z-index:5}h1{margin:0 0 12px;font-size:25px}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.f,input,select{width:100%;padding:13px;border:1px solid #bbb;border-radius:11px;background:#fff;font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.st{background:#292929;border-radius:11px;text-align:center;padding:8px}.st b{display:block;font-size:25px}.st span{font-size:10px;color:#ddd}main{padding:14px}.sec{font-weight:800;color:#555;letter-spacing:1px;margin:12px 3px 7px}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 5px #0001}.q,.p,.r,.a{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:14px;padding:17px 8px;background:#fff;box-shadow:0 2px 5px #0002;color:#087ee5;font-size:17px;font-weight:800}.green{background:#dff5db}.red{background:#ffe0e0}.a{grid-template-columns:1fr 1fr 1fr}.a button{background:#111;color:#fff;font-size:14px;padding:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccc;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:9}.bottom button{background:#111;color:#fff;font-size:13px;padding:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;color:#666;margin:5px 0}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.box{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right;background:#eee;color:#222;padding:8px 12px;font-size:14px}.hide{display:none}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:center}
</style></head><body><header><h1>🏈 Varsity QB Scorer</h1><div class="g"><input id="qb" class="f" placeholder="QB name"><input id="opp" class="f" placeholder="Opponent"><input id="team" class="f" placeholder="Team"><input id="score" class="f" placeholder="Score"></div><div class="stats">
<div class="st"><b id="c">0</b><span>COMP</span></div><div class="st"><b id="a">0</b><span>ATT</span></div><div class="st"><b id="p">0%</b><span>CMP %</span></div><div class="st"><b id="y">0</b><span>PASS YDS</span></div><div class="st"><b id="tdp">0</b><span>PASS TD</span></div><div class="st"><b id="i">0</b><span>INT</span></div><div class="st"><b id="ra">0</b><span>RUSH ATT</span></div><div class="st"><b id="ry">0</b><span>RUSH YDS</span></div></div></header>
<main><div class="card"><div class="sec">GAME / DRIVE</div><div class="row"><div><label>Quarter</label><select id="q"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>OT</option></select></div><div><label>Drive #</label><input id="drive" type="number" value="1"></div><div><label>Down</label><select id="down"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option></select></div><div><label>Distance</label><input id="dist" placeholder="10"></div></div></div>
<div class="sec">PASSING</div><div class="p"><button class="green" onclick="play('COMPLETE')">✓ COMPLETE</button><button onclick="play('INCOMPLETE')">INCOMPLETE</button><button class="red" onclick="play('INT')">⚠ INT</button><button onclick="play('SPIKE')">SPIKE</button></div>
<div class="sec">RUSHING / NEGATIVE PLAYS</div><div class="r"><button class="green" onclick="play('QB RUN')">QB RUN</button><button onclick="play('SCRAMBLE')">SCRAMBLE</button><button onclick="play('SACK')">SACK</button><button class="red" onclick="play('FUMBLE')">FUMBLE</button></div>
<div class="sec">RESULT DETAILS</div><div class="card"><div class="row"><div><label>Yards</label><input id="yd" type="number" inputmode="numeric" value="0"></div><div><label>Receiver</label><input id="rec" placeholder="Name / #"></div><div><label>TD?</label><select id="td"><option value="0">No</option><option value="1">Yes</option></select></div><div><label>First Down?</label><select id="fd"><option value="0">No</option><option value="1">Yes</option></select></div><div class="full"><label>Note</label><input id="note" placeholder="Optional"></div></div></div>
<div class="a"><button onclick="note()">NOTE</button><button onclick="undo()">↩ UNDO</button><button onclick="summary()">SUMMARY</button></div>
<div class="sec">RECENT PLAYS</div><div class="card" id="recent">No plays yet.</div></main>
<div class="bottom"><button onclick="summary()">SUMMARY</button><button onclick="csv()">EXPORT CSV</button><button onclick="newGame()">NEW GAME</button></div>
<div id="m" class="modal hide"><div class="box"><button class="close" onclick="closeM()">Close</button><h2>Game Summary</h2><div id="mb"></div></div></div>
<script>
const K='QBSCORER_V2';let G=JSON.parse(localStorage.getItem(K)||'null')||{meta:{},plays:[],hist:[]};
const $=id=>document.getElementById(id), V=id=>$(id).value;
function save(){localStorage.setItem(K,JSON.stringify(G));render()}
['qb','opp','team','score'].forEach(id=>$(id).oninput=()=>{G.meta[id]=V(id);save()});
function ctx(){return{q:V('q'),drive:V('drive')||1,down:V('down'),dist:V('dist'),yards:+V('yd')||0,rec:V('rec').trim(),td:V('td')==='1',fd:V('fd')==='1',note:V('note').trim()}}
function play(t){let x=ctx();if(t==='INT'||t==='SPIKE'){x.yards=0;x.td=false;x.fd=false;x.rec=''}G.hist.push(JSON.stringify(G.plays));G.plays.push({t,...x});clear();save()}
function note(){let x=ctx();x.yards=0;G.hist.push(JSON.stringify(G.plays));G.plays.push({t:'NOTE',...x});clear();save()}
function clear(){['yd','rec','note'].forEach(x=>$(x).value='');$('td').value='0';$('fd').value='0'}
function undo(){if(G.hist.length){G.plays=JSON.parse(G.hist.pop());save()}}
function stats(){let s={c:0,a:0,y:0,tdp:0,i:0,ra:0,ry:0};G.plays.forEach(x=>{if(['COMPLETE','INCOMPLETE','INT','SPIKE'].includes(x.t))s.a++;if(x.t==='COMPLETE'){s.c++;s.y+=x.yards;if(x.td)s.tdp++}if(x.t==='INT')s.i++;if(['QB RUN','SCRAMBLE'].includes(x.t)){s.ra++;s.ry+=x.yards}if(x.t==='SACK')s.ry+=x.yards});return s}
function render(){let s=stats();Object.entries(s).forEach(([k,v])=>$(k).textContent=v);$('p').textContent=(s.a?Math.round(s.c/s.a*100):0)+'%';$('recent').innerHTML=G.plays.slice(-10).reverse().map((x,n)=>`${G.plays.length-n}. ${x.q} • ${x.down}&${x.dist||'—'} • <b>${x.t}</b> ${x.yards?x.yards+' yds':''}${x.rec?' • '+x.rec:''}${x.td?' • TD':''}${x.fd?' • 1D':''}${x.note?' • '+x.note:''}`).join('<hr>')||'No plays yet.'}
function summary(){let s=stats(),qs={};G.plays.forEach(x=>(qs[x.q]??=[]).push(x));let rows=Object.entries(qs).map(([q,a])=>{let pa=a.filter(x=>['COMPLETE','INCOMPLETE','INT','SPIKE'].includes(x.t)),c=a.filter(x=>x.t==='COMPLETE'),r=a.filter(x=>['QB RUN','SCRAMBLE'].includes(x.t));return`<tr><td>${q}</td><td>${c.length}/${pa.length}</td><td>${c.reduce((z,x)=>z+x.yards,0)}</td><td>${r.reduce((z,x)=>z+x.yards,0)}</td><td>${a.filter(x=>x.td).length}</td></tr>`}).join('');$('mb').innerHTML=`<p><b>${G.meta.qb||'QB'}</b> vs <b>${G.meta.opp||'Opponent'}</b></p><p>${s.c}/${s.a} passing • ${s.pct||Math.round((s.c/(s.a||1))*100)}% • ${s.y} pass yds • ${s.tdp} pass TD • ${s.i} INT<br>${s.ra} rush • ${s.ry} rush yds</p><h3>Quarter Breakdown</h3><table><tr><th>Qtr</th><th>C/A</th><th>Pass Yds</th><th>Rush Yds</th><th>TD</th></tr>${rows||'<tr><td colspan="5">No plays</td></tr>'}</table>`;$('m').classList.remove('hide')}
function closeM(){$('m').classList.add('hide')}
function csv(){let r=[['Quarter','Drive','Down','Distance','Play','Yards','TD','First Down','Receiver','Note']].concat(G.plays.map(x=>[x.q,x.drive,x.down,x.dist,x.t,x.yards,x.td?'Yes':'No',x.fd?'Yes':'No',x.rec,x.note]));let z=r.map(a=>a.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([z],{type:'text/csv'}));a.download='QB_game_stats.csv';a.click()}
function newGame(){if(confirm('Start a new game? Current game will be cleared from this screen. Export CSV first if you want a file copy.')){G={meta:{},plays:[],hist:[]};save();['qb','opp','team','score'].forEach(id=>$(id).value='')}}
['qb','opp','team','score'].forEach(id=>$(id).value=G.meta[id]||'');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
