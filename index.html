<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Varsity QB Scorer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#171717;padding-bottom:88px}header{background:#111;color:#fff;padding:14px;position:sticky;top:0;z-index:5}h1{margin:0 0 12px;font-size:25px}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.f,input,select{width:100%;padding:13px;border:1px solid #bbb;border-radius:11px;background:#fff;font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.st{background:#292929;border-radius:11px;text-align:center;padding:8px}.st b{display:block;font-size:25px}.st span{font-size:10px;color:#ddd}main{padding:14px}.sec{font-weight:800;color:#555;letter-spacing:1px;margin:12px 3px 7px}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 5px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;color:#666;margin:5px 0}button{border:0;border-radius:14px;padding:17px 8px;background:#fff;box-shadow:0 2px 5px #0002;color:#087ee5;font-size:17px;font-weight:800}.green{background:#dff5db}.red{background:#ffe0e0}.muted{color:#666;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccc;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:9}.bottom button{background:#111;color:#fff;font-size:13px;padding:14px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right;background:#eee;color:#222;padding:8px 12px;font-size:14px}.hide{display:none}.big{font-size:20px!important;padding:17px!important}.check{display:flex;gap:18px;align-items:center;padding:14px 0}.check input{width:25px;height:25px}.save{background:#111;color:#fff;width:100%;margin-top:12px}.cancel{width:100%;margin-top:8px;background:#eee;color:#222}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{padding:19px 8px}.recent{background:#fff;border-radius:14px;padding:12px}.recent hr{border:0;border-top:1px solid #ddd}
</style></head><body>
<header><h1>🏈 Varsity QB Scorer</h1><div class="g"><input id="qb" class="f" placeholder="QB name"><input id="opp" class="f" placeholder="Opponent"><input id="team" class="f" placeholder="Team"><input id="score" class="f" placeholder="Score"></div><div class="stats">
<div class="st"><b id="c">0</b><span>COMP</span></div><div class="st"><b id="a">0</b><span>ATT</span></div><div class="st"><b id="p">0%</b><span>CMP %</span></div><div class="st"><b id="y">0</b><span>PASS YDS</span></div><div class="st"><b id="tdp">0</b><span>PASS TD</span></div><div class="st"><b id="i">0</b><span>INT</span></div><div class="st"><b id="ra">0</b><span>RUSH ATT</span></div><div class="st"><b id="ry">0</b><span>RUSH YDS</span></div></div></header>
<main>
<div class="card"><div class="sec">GAME / DRIVE</div><div class="row"><div><label>Quarter</label><select id="q"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>OT</option></select></div><div><label>Drive #</label><input id="drive" type="number" value="1"></div><div><label>Down</label><select id="down"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option></select></div><div><label>Distance</label><input id="dist" placeholder="10"></div></div></div>

<div class="sec">QUICK SCORING</div><div class="quick">
<button class="green" onclick="startPlay('COMPLETE')">✓ COMPLETE</button><button onclick="startPlay('INCOMPLETE')">INCOMPLETE</button>
<button class="red" onclick="startPlay('INT')">⚠ INTERCEPTION</button><button onclick="startPlay('SPIKE')">SPIKE</button>
<button class="green" onclick="startPlay('QB RUN')">QB RUN</button><button onclick="startPlay('SCRAMBLE')">SCRAMBLE</button>
<button onclick="startPlay('SACK')">SACK</button><button class="red" onclick="startPlay('FUMBLE')">FUMBLE</button>
</div>

<div class="sec">RECENT PLAYS</div><div class="recent" id="recent">No plays yet.</div>
</main><div class="bottom"><button onclick="summary()">SUMMARY</button><button onclick="csv()">EXPORT CSV</button><button onclick="newGame()">NEW GAME</button></div>

<div id="m" class="modal hide"><div class="box"><button class="close" onclick="closeM()">Cancel</button><h2 id="mt">Enter Play</h2><div id="form"></div></div></div>
<script>
const K='QBSCORER_V3';let G=JSON.parse(localStorage.getItem(K)||'null')||{meta:{},plays:[],hist:[]};const $=id=>document.getElementById(id),V=id=>$(id).value;
function save(){localStorage.setItem(K,JSON.stringify(G));render()}['qb','opp','team','score'].forEach(id=>$(id).oninput=()=>{G.meta[id]=V(id);save()});
function ctx(){return{q:V('q'),drive:V('drive')||1,down:V('down'),dist:V('dist')}}
function startPlay(type){let c=ctx(), yards=['INCOMPLETE','INT','SPIKE'].includes(type)?0:'';let pass=['COMPLETE','INCOMPLETE'].includes(type), rush=['QB RUN','SCRAMBLE'].includes(type), sack=type==='SACK', fumble=type==='FUMBLE';
$('mt').textContent=type==='INT'?'Interception':type==='INCOMPLETE'?'Incomplete Pass':type==='SPIKE'?'Spike':type==='SACK'?'Sack':type==='FUMBLE'?'Fumble':type;
$('form').innerHTML=`<label>Yards</label><input id="pyard" class="big" type="number" inputmode="numeric" value="${yards}" placeholder="0" autofocus>
${pass?'<label>Receiver</label><input id="prec" class="big" placeholder="Name / #">':''}
${!['INCOMPLETE','INT','SPIKE','SACK','FUMBLE'].includes(type)?'<div class="check"><input id="ptd" type="checkbox"><label>Touchdown</label><input id="pfd" type="checkbox"><label>First Down</label></div>':''}
<label>Note</label><input id="pnote" class="big" placeholder="Optional note"><button class="save" onclick="commit('${type}')">SAVE PLAY</button><button class="cancel" onclick="closeM()">CANCEL</button>`;
$('m').classList.remove('hide');setTimeout(()=>$('pyard')?.focus(),100)}
function commit(type){let x=ctx();x.yards=+($('pyard')?.value||0);x.rec=$('prec')?.value.trim()||'';x.td=$('ptd')?.checked||false;x.fd=$('pfd')?.checked||false;x.note=$('pnote')?.value.trim()||'';if(['INCOMPLETE','INT','SPIKE','SACK','FUMBLE'].includes(type)){x.td=false;x.fd=false}G.hist.push(JSON.stringify(G.plays));G.plays.push({t:type,...x});closeM();save()}
function closeM(){$('m').classList.add('hide')}
function undo(){if(G.hist.length){G.plays=JSON.parse(G.hist.pop());save()}}
function stats(){let s={c:0,a:0,y:0,tdp:0,i:0,ra:0,ry:0};G.plays.forEach(x=>{if(['COMPLETE','INCOMPLETE','INT','SPIKE'].includes(x.t))s.a++;if(x.t==='COMPLETE'){s.c++;s.y+=x.yards;if(x.td)s.tdp++}if(x.t==='INT')s.i++;if(['QB RUN','SCRAMBLE'].includes(x.t)){s.ra++;s.ry+=x.yards}if(x.t==='SACK')s.ry+=x.yards});s.p=s.a?Math.round(s.c/s.a*100):0;return s}
function render(){let s=stats();Object.entries(s).forEach(([k,v])=>$(k)?.textContent=v);$('recent').innerHTML=G.plays.slice(-12).reverse().map((x,n)=>`${G.plays.length-n}. ${x.q} • ${x.down}&${x.dist||'—'} • <b>${x.t}</b> ${x.yards?x.yards+' yds':''}${x.rec?' • '+x.rec:''}${x.td?' • TD':''}${x.fd?' • 1D':''}${x.note?' • '+x.note:''}`).join('<hr>')||'No plays yet.'}
function summary(){let s=stats(),qs={};G.plays.forEach(x=>(qs[x.q]??=[]).push(x));let rows=Object.entries(qs).map(([q,a])=>{let pa=a.filter(x=>['COMPLETE','INCOMPLETE','INT','SPIKE'].includes(x.t)),c=a.filter(x=>x.t==='COMPLETE'),r=a.filter(x=>['QB RUN','SCRAMBLE'].includes(x.t));return`<tr><td>${q}</td><td>${c.length}/${pa.length}</td><td>${c.reduce((z,x)=>z+x.yards,0)}</td><td>${r.reduce((z,x)=>z+x.yards,0)}</td><td>${a.filter(x=>x.td).length}</td></tr>`}).join('');$('mt').textContent='Game Summary';$('form').innerHTML=`<p><b>${G.meta.qb||'QB'}</b> vs <b>${G.meta.opp||'Opponent'}</b></p><p><b>${s.c}/${s.a}</b> passing • ${s.p}% • ${s.y} pass yds • ${s.tdp} pass TD • ${s.i} INT<br><b>${s.ra}</b> rush • ${s.ry} rush yds</p><h3>Quarter Breakdown</h3><table>${rows||'<tr><td>No plays</td></tr>'}</table><button class="cancel" onclick="closeM()">CLOSE</button>`;$('m').classList.remove('hide')}
function csv(){let r=[['Quarter','Drive','Down','Distance','Play','Yards','TD','First Down','Receiver','Note']].concat(G.plays.map(x=>[x.q,x.drive,x.down,x.dist,x.t,x.yards,x.td?'Yes':'No',x.fd?'Yes':'No',x.rec,x.note]));let z=r.map(a=>a.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([z],{type:'text/csv'}));a.download='QB_game_stats.csv';a.click()}
function newGame(){if(confirm('Start a new game? Export CSV first if you want a copy.')){G={meta:{},plays:[],hist:[]};save();['qb','opp','team','score'].forEach(id=>$(id).value='')}}
['qb','opp','team','score'].forEach(id=>$(id).value=G.meta[id]||'');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
